<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <meta charset="utf-8">
  <meta name="theme-color" content="#0D0F12">
  <link rel="stylesheet" href="style.css">
  <title>WLED Live Preview</title>
  <style>
    body {
      margin: 0;
      background-color: var(--app-bg-base, #0D0F12);
      background-image: var(--app-bg-bloom);
      overflow: hidden;
    }
    /* Viewer frame: same glass-catch border as app panels */
    #viewerFrame {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-top:    1px solid var(--app-border-highlight, rgba(255,255,255,0.18));
      border-left:   1px solid var(--app-border-highlight, rgba(255,255,255,0.12));
      border-right:  1px solid var(--app-border, rgba(255,255,255,0.07));
      border-bottom: 1px solid var(--app-border, rgba(255,255,255,0.07));
    }
    #canv {
      background: var(--app-bg-base, #0D0F12);
      filter: brightness(175%);
      width: 100%;
      height: 100%;
      position: absolute;
    }
  </style>
  <script>
    // load common.js with retry on error
    (function common() {
      const l = document.createElement('script');
      l.src = 'common.js';
      l.onload = () => S();
      l.onerror = () => setTimeout(common, 100);
      document.head.appendChild(l);
    })();
    var ws;
    var tmout = null;
    var c;
    var ctx;
    function draw(start, skip, leds, fill) {
      c.width = d.documentElement.clientWidth;
      let w = (c.width * skip) / (leds.length - start);
      for (let i = start; i < leds.length; i += skip) {
        ctx.fillStyle = fill(leds,i);
        ctx.fillRect(Math.round((i - start) * w / skip), 0, Math.ceil(w), c.height);
      }
    }
    function update(retry=0) { // via HTTP (/json/live)
      if (d.hidden) {
        clearTimeout(tmout);
        tmout = setTimeout(update, 250);
        return;
      }
      fetch('./json/live')
      .then(res => {
        if (!res.ok) {
          clearTimeout(tmout);
          tmout = setTimeout(update, 2500);
        }
        return res.json();
      })
      .then(json => {
        draw(0, 1, json.leds, (a,i) => "#" + ((a[i].length > 6) ? a[i].substring(2) : a[i]));
        clearTimeout(tmout);
        tmout = setTimeout(update, 40);
      })
      .catch((error)=>{
        //console.error("Peek HTTP error:",error);
        clearTimeout(tmout);
        if (retry<5) tmout = setTimeout(() => update(retry+1), 2500); // stop endlessly bugging the ESP if resource is not available
      })
    }
    function S() { // Startup function (onload)
      c = d.getElementById('canv');
      ctx = c.getContext('2d');
      if (window.location.href.indexOf("?ws") == -1) {update(); return;}

      // Initialize WebSocket connection
      ws = connectWs(ws => ws.send('{"lv":true}'));
      ws.addEventListener('message', (e) => {
        try {
          if (toString.call(e.data) === '[object ArrayBuffer]') {
            let leds = new Uint8Array(e.data);
            if (leds[0] != 76) return; //'L'
            // leds[1] = 1: 1D; leds[1] = 2: 1D/2D (leds[2]=w, leds[3]=h)
            draw(leds[1]==2 ? 4 : 2, 3, leds, (a,i) => `rgb(${a[i]},${a[i+1]},${a[i+2]})`);
          }
        } catch (err) {
          console.error("Peek WS error:",err);
        } 
      });
    }
  </script>
</head>
<body>
  <div id="viewerFrame">
    <canvas id="canv"></canvas>
  </div>

<script src="/mock/hud.js"></script>
</body>
</html>
